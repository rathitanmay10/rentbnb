<!DOCTYPE html>
<html>

<head>
    <title>Payment Status - RentBnB</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        h3 {
            color: #333;
        }

        .status {
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .loading {
            background-color: #fff3e0;
            color: #e65100;
        }

        .success {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .error {
            background-color: #ffebee;
            color: #c62828;
        }

        .pending {
            background-color: #e3f2fd;
            color: #1565c0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .booking-details {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            text-align: left;
        }

        .booking-details h4 {
            margin-top: 0;
        }

        .booking-details p {
            margin: 5px 0;
        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <h2>Payment Verification</h2>
    <div class="spinner" id="spinner"></div>
    <h3 id="status" class="status loading">Verifying your payment...</h3>
    <div id="booking-details" class="booking-details" style="display: none;"></div>
    <button id="view-booking-btn" style="display: none;" onclick="viewBooking()">View Booking Details</button>
    <button id="retry-btn" style="display: none;" onclick="retryPayment()">Retry Payment</button>

    <script>
        const API_BASE = window.location.origin + "/api/v1";
        let pollCount = 0;
        const MAX_POLLS = 30; // Poll for max 1 minute (30 * 2 seconds)

        function pollPaymentStatus() {
            const statusEl = document.getElementById("status");
            const spinner = document.getElementById("spinner");
            const params = new URLSearchParams(window.location.search);

            const token = params.get("token");
            const bookingId = params.get("booking_id");
            const paymentId = params.get("payment_id");

            if (!token || !bookingId) {
                statusEl.innerText = "❌ Invalid payment session";
                statusEl.className = "status error";
                spinner.style.display = "none";
                return;
            }

            pollCount++;

            // Fetch booking details to check payment status
            fetch(`${API_BASE}/bookings/${bookingId}`, {
                headers: {
                    "Authorization": "Bearer " + token
                }
            })
                .then(res => {
                    if (!res.ok) throw new Error("Request failed");
                    return res.json();
                })
                .then(data => {
                    console.log("Booking data:", data);

                    // Check payment status from the payments array
                    const payments = data.payments || [];
                    const payment = payments.find(p => p.id === paymentId) || payments[0];

                    if (!payment) {
                        statusEl.innerText = "⏳ Waiting for payment information...";
                        statusEl.className = "status pending";
                        if (pollCount < MAX_POLLS) {
                            setTimeout(pollPaymentStatus, 2000);
                        } else {
                            statusEl.innerText = "⚠️ Payment verification timeout. Please check your bookings.";
                            statusEl.className = "status error";
                            spinner.style.display = "none";
                        }
                        return;
                    }

                    const paymentStatus = payment.status.toLowerCase();
                    const bookingStatus = data.status.toLowerCase();

                    // ✅ SUCCESS STATES
                    if (paymentStatus === "paid" || bookingStatus === "confirmed") {
                        statusEl.innerText = "✅ Payment successful! Your booking is confirmed.";
                        statusEl.className = "status success";
                        spinner.style.display = "none";
                        showBookingDetails(data);
                        document.getElementById("view-booking-btn").style.display = "inline-block";
                        return;
                    }

                    // ❌ FAILURE STATES
                    if (paymentStatus === "failed" || bookingStatus === "cancelled") {
                        statusEl.innerText = "❌ Payment failed or was cancelled. If money was deducted, it will be refunded within 5-7 business days.";
                        statusEl.className = "status error";
                        spinner.style.display = "none";
                        document.getElementById("retry-btn").style.display = "inline-block";
                        return;
                    }

                    // ⏳ IN-PROGRESS STATES
                    if (paymentStatus === "pending" || bookingStatus === "pending") {
                        statusEl.innerText = "⏳ Finalizing your payment... Please wait.";
                        statusEl.className = "status pending";

                        if (pollCount < MAX_POLLS) {
                            setTimeout(pollPaymentStatus, 2000);
                        } else {
                            statusEl.innerText = "⚠️ Payment is taking longer than expected. Please check your email or contact support.";
                            statusEl.className = "status error";
                            spinner.style.display = "none";
                        }
                        return;
                    }

                    // Unknown state
                    statusEl.innerText = `⏳ Payment status: ${paymentStatus}. Checking again...`;
                    statusEl.className = "status pending";
                    if (pollCount < MAX_POLLS) {
                        setTimeout(pollPaymentStatus, 2000);
                    }
                })
                .catch((error) => {
                    console.error("Error:", error);
                    statusEl.innerText = "⚠️ Waiting for payment confirmation...";
                    statusEl.className = "status pending";

                    if (pollCount < MAX_POLLS) {
                        setTimeout(pollPaymentStatus, 3000);
                    } else {
                        statusEl.innerText = "❌ Unable to verify payment. Please contact support.";
                        statusEl.className = "status error";
                        spinner.style.display = "none";
                    }
                });
        }

        function showBookingDetails(booking) {
            const detailsDiv = document.getElementById("booking-details");
            detailsDiv.innerHTML = `
                <h4>Booking Confirmed!</h4>
                <p><strong>Booking ID:</strong> ${booking.id}</p>
                <p><strong>Property ID:</strong> ${booking.property_id}</p>
                <p><strong>Check-in:</strong> ${booking.check_in}</p>
                <p><strong>Check-out:</strong> ${booking.check_out}</p>
                <p><strong>Total Amount:</strong> ₹${booking.total_amount}</p>
                <p><strong>Status:</strong> ${booking.status}</p>
            `;
            detailsDiv.style.display = "block";
        }

        function viewBooking() {
            const params = new URLSearchParams(window.location.search);
            const bookingId = params.get("booking_id");
            // You can redirect to a booking details page or show more info
            alert(`Booking ID: ${bookingId}\n\nYou can view full details in your bookings list.`);
        }

        function retryPayment() {
            window.location.href = "/static/html/booking-checkout.html";
        }

        // Start polling when page loads
        pollPaymentStatus();
    </script>

</body>

</html>
