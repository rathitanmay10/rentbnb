databases:
  - name: rentbnb_db
    databaseName: rentbnb
    user: admin
    plan: free

services:
  # ── Redis (Managed) ────────────────────────────────────────────────────────
  - type: redis
    name: rentbnb_redis
    plan: free
    ipAllowList: []

  # ── FastAPI App (Web Service) ──────────────────────────────────────────────
  - type: web
    name: rentbnb_app
    image: tanmayrathi/rentbnb:latest
    plan: free
    healthCheckPath: /api/v1/properties/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rentbnb_db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: rentbnb_redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: rentbnb_redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromRedis:
          name: rentbnb_redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_EXPIRE_MIN
        value: "15"
      - key: REFRESH_EXPIRE_DAYS
        value: "7"
      - key: TEST_DATABASE_URL
        value: "unused"
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@yopmail.com
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
    command: sh -c "alembic upgrade head && python scripts/seed_super_admin.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT"

  # ── Celery Worker ──────────────────────────────────────────────────────────
  - type: worker
    name: rentbnb_worker
    image: tanmayrathi/rentbnb:latest
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rentbnb_db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: rentbnb_redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: rentbnb_redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromRedis:
          name: rentbnb_redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: rentbnb_app
          envVar: SECRET_KEY
      - key: ALGORITHM
        value: HS256
      - key: TEST_DATABASE_URL
        value: "unused"
    command: celery -A app.celery_app.celery_app worker --loglevel=info

  # ── Celery Beat ────────────────────────────────────────────────────────────
  - type: worker
    name: rentbnb_beat
    image: tanmayrathi/rentbnb:latest
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rentbnb_db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: rentbnb_redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromRedis:
          name: rentbnb_redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromRedis:
          name: rentbnb_redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          type: web
          name: rentbnb_app
          envVar: SECRET_KEY
      - key: ALGORITHM
        value: HS256
      - key: TEST_DATABASE_URL
        value: "unused"
    command: celery -A app.celery_app.celery_app beat --loglevel=info
