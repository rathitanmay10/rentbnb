databases:
  - name: rentbnb_db
    databaseName: rentbnb
    user: admin
    plan: free

services:
  # ── Redis (Managed) ────────────────────────────────────────────────────────
  - type: redis
    name: rentbnb_redis
    plan: free # Redis free tier is available
    ipAllowList: []

  # ── FastAPI App (Web Service) ──────────────────────────────────────────────
  - type: web
    name: rentbnb_app
    runtime: image
    image:
      url: tanmayrathi/rentbnb:latest
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rentbnb_db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: rentbnb_redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: rentbnb_redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: rentbnb_redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_EXPIRE_MIN
        value: "15"
      - key: REFRESH_EXPIRE_DAYS
        value: "7"
      - key: TEST_DATABASE_URL
        value: "unused"
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@yopmail.com
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
    dockerCommand: ./scripts/render-start.sh

